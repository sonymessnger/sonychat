<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Аватар</title>
  <link rel="stylesheet" href="avatar.css">
</head>
<body>
  <div class="card">
    <h1>Создать аватар</h1>
    <div class="avatar-preview" id="preview">A</div>
    <input type="file" id="fileInput" accept="image/*" style="display:none">
    <button class="choose" id="chooseBtn">Выбрать фото</button>
    <p id="message"></p>
    <button class="back" id="backBtn">← Назад в чат</button>
  </div>
  <script src="avatar.js"></script>
</body>
</html>
